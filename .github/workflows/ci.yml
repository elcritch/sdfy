on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        nimversion:
          - '2.2.6'
        os:
          - ubuntu-24.04
    steps:
    - uses: actions/checkout@v1

    - name: Install GrabNim
      run: |
        curl -fsSL https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh | sh
        "$HOME/.nimble/bin/grabnim" "${{ matrix.nimversion }}"
        echo "$HOME/.local/share/grabnim/current/bin" >> $GITHUB_PATH
        echo "$HOME/.nimble/bin" >> $GITHUB_PATH

    - name: Cache packages
      uses: actions/cache@v3
      with:
        path: deps/
        key: ${{ runner.os }}-${{ hashFiles('sdfy.nimble') }}

    - name: Install Atlas
      run: |
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/0.14.10/install.sh | \
          ATLAS_REF=0.14.10 ATLAS_INSTALL_DIR="$HOME/.nimble/bin" bash -
        echo "Nim:: "
        nim -v
        echo "Atlas:: "
        atlas -v

    - name: Install Deps
      run: |
        atlas install --feature:test

    - name: Build Tests
      run: |
        nim test
